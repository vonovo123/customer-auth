name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify CORS proxy secret
        env:
          VITE_CORS_PROXY_URL: ${{ secrets.VITE_CORS_PROXY_URL }}
        run: |
          if [ -z "$VITE_CORS_PROXY_URL" ]; then
            echo "::error::Repository secret VITE_CORS_PROXY_URL is empty or missing."
            echo "GitHub → Settings → Secrets and variables → Actions → New repository secret"
            echo "Name must be exactly: VITE_CORS_PROXY_URL"
            echo "Value example: https://your-worker.your-subdomain.workers.dev"
            exit 1
          fi
          echo "VITE_CORS_PROXY_URL is set (length ${#VITE_CORS_PROXY_URL})"

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://interview.honestfund.kr
          VITE_CORS_PROXY_URL: ${{ secrets.VITE_CORS_PROXY_URL }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
